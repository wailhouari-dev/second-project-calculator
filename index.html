<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple calculator built with HTML, CSS and JavaScript." />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <!-- defer = the page shows first, then the script runs -->
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="calculator" aria-label="Calculator">
      <!-- the screen. aria-live makes screen readers read the changes -->
      <output id="display" class="display" aria-live="polite">0</output>

      <!-- data-action = what the button does, data-value = the number or operator -->
      <div class="keypad">
        <button class="key danger" data-action="clear" aria-label="Clear all">C</button>
        <button class="key danger" data-action="delete" aria-label="Delete last">DEL</button>
        <button class="key operator" data-action="operator" data-value="/" aria-label="Divide">÷</button>
        <button class="key operator" data-action="operator" data-value="*" aria-label="Multiply">×</button>

        <button class="key" data-action="number" data-value="7">7</button>
        <button class="key" data-action="number" data-value="8">8</button>
        <button class="key" data-action="number" data-value="9">9</button>
        <button class="key operator" data-action="operator" data-value="-" aria-label="Subtract">−</button>

        <button class="key" data-action="number" data-value="4">4</button>
        <button class="key" data-action="number" data-value="5">5</button>
        <button class="key" data-action="number" data-value="6">6</button>
        <button class="key operator" data-action="operator" data-value="+" aria-label="Add">+</button>

        <button class="key" data-action="number" data-value="1">1</button>
        <button class="key" data-action="number" data-value="2">2</button>
        <button class="key" data-action="number" data-value="3">3</button>
        <button class="key equals" data-action="equals" aria-label="Equals">=</button>

        <button class="key zero" data-action="number" data-value="0">0</button>
        <button class="key" data-action="dot" aria-label="Decimal point">.</button>
      </div>
    </main>
  </body>
</html>
